name: package
# .deb (Debian 13), .rpm (Fedora / RHEL / Rocky) and tar.gz for x86_64 and aarch64. Built in clean containers, installed and run in
# clean containers of each family (ci/package-test.sh), published on GitHub Releases when a tag vX.Y.Z is pushed.
on:
  push:
    tags: ['v*']
    branches: [develop]
    paths: ['ci/package-*', 'dist/**', 'bins/rdsktp/Cargo.toml', '.github/workflows/package.yml']
  pull_request:
    paths: ['ci/package-*', 'dist/**', 'bins/rdsktp/Cargo.toml', '.github/workflows/package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
        format: [deb, rpm, tar]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -1)"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match version $v" >&2; exit 1; }
      - run: ENGINE=docker ci/package-container.sh ${{ matrix.format }} out
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.arch }}-${{ matrix.format }}
          path: out/
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-${{ matrix.arch }}-*
          path: packages
          merge-multiple: true
      - run: ENGINE=docker ci/package-test.sh packages
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          cat SHA256SUMS-*.txt > SHA256SUMS
          rm SHA256SUMS-*.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*
