name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config clang libclang-dev curl ca-certificates git
      - uses: actions/checkout@v4
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: |
          . "$HOME/.cargo/env"
          rustup show
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          bash ci/check-deps.sh
  features:
    # Optional backends (KWin/PipeWire session, VA-API GPU encoder) against Debian 13's development headers.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config clang libclang-dev libpipewire-0.3-dev libva-dev curl ca-certificates git
      - uses: actions/checkout@v4
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: |
          . "$HOME/.cargo/env"
          F="--features oxydesk/kwin,oxydesk-agent/kwin,bench/kwin,oxydesk/vaapi,oxydesk-agent/vaapi,bench/vaapi,oxydesk-encode/openh264"
          cargo clippy --workspace --all-targets $F -- -D warnings
          cargo test --workspace $F
  coverage:
    # Test coverage: a reference to read (HTML report in the artifacts), not a gate. Policy: CLAUDE.md.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: debian:trixie
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config clang libclang-dev curl ca-certificates git python3
      - uses: actions/checkout@v4
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c llvm-tools
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: |
          . "$HOME/.cargo/env"
          bash ci/coverage.sh target/coverage | tee coverage.txt
          { echo '### Test coverage'; echo '```'; tail -n 4 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
