name: Pages

on:
  push:
    branches: [develop]
    paths: ["site/**", "README.md", "crates/**", "bins/**", "Cargo.toml", "ci/prerender-docs.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API reference (rustdoc)
        run: |
          cargo doc --workspace --no-deps
          mkdir -p _site/api
          cp -r target/doc/. _site/api/
          echo '<meta http-equiv="refresh" content="0; url=rdsktp_core/index.html">' > _site/api/index.html
      - name: Add the landing page
        run: cp -r site/. _site/
      - name: Prerender the settings into the documentation page
        run: node ci/prerender-docs.mjs _site/docs.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
