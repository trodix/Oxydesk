[package]
name = "oxydesk-rdp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxydesk-core.workspace = true
ironrdp-server = { version = "=0.13.0", features = ["egfx", "helper"] }
ironrdp-egfx = "=0.3.0"
ironrdp-dvc = "=0.8.0"
ironrdp-svc = "0.8"
ironrdp-rdpdr = { path = "../../third_party/ironrdp-rdpdr" }
ironrdp-cliprdr = "=0.7.0"
ironrdp-rdpsnd = "0.9"
ironrdp-core = "0.2"
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
ironrdp-displaycontrol = "=0.8.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
png = "0.17"
hmac = "0.13"
md-5 = "0.11"
ab_glyph = "0.2"

[dev-dependencies]
socket2 = { version = "0.6", features = ["all"] }
