[package]
name = "rdsktp-encode"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# H.264 through libopenh264 loaded at runtime (no C++ build required).
openh264 = ["dep:openh264"]

[dependencies]
rdsktp-core.workspace = true
openh264 = { version = "0.9.8", default-features = false, features = ["libloading"], optional = true }
