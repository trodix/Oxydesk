[package]
name = "rdsktp-capture"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# KWin capture: zkde_screencast (Wayland) + PipeWire stream (see ADR 004).
kwin = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-scanner", "dep:pipewire"]

[dependencies]
rdsktp-core.workspace = true
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-scanner = { version = "0.31", optional = true }
pipewire = { version = "0.9", optional = true }
