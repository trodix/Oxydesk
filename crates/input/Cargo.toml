[package]
name = "oxydesk-input"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Injection through org_kde_kwin_fake_input (Wayland client authorized by a .desktop, see ADR 004).
kwin = ["dep:wayland-client", "dep:wayland-backend", "dep:wayland-scanner"]

[dependencies]
oxydesk-core.workspace = true
wayland-client = { version = "0.31", optional = true }
wayland-backend = { version = "0.3", optional = true }
wayland-scanner = { version = "0.31", optional = true }
