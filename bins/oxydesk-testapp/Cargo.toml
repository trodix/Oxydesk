[package]
name = "oxydesk-testapp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic fullscreen window (marker + heartbeat) to test capture and input under a real KWin."

[dependencies]
oxydesk-capture.workspace = true
oxydesk-core.workspace = true
oxydesk-clipboard = { workspace = true, features = ["wayland"] }
oxydesk-audio.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
