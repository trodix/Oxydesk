[package]
name = "rdp-test-client"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rdp_test_client"
path = "src/lib.rs"

[[bin]]
name = "rdp-test-client"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
png = "0.17"
oxydesk-core.workspace = true
anyhow = { version = "1", optional = true }
ironrdp-connector = { version = "=0.10.0", optional = true }
ironrdp-session = { version = "=0.11.0", optional = true }
ironrdp-pdu = { version = "0.9", optional = true }
ironrdp-graphics = { version = "0.9", optional = true }
ironrdp-svc = { version = "0.8", optional = true }
ironrdp-core = { version = "0.2", optional = true }
ironrdp-blocking = { version = "=0.10.0", optional = true }
ironrdp-egfx = { version = "=0.3.0", optional = true }
ironrdp-dvc = { version = "=0.8.0", optional = true }
ironrdp-displaycontrol = { version = "=0.8.0", optional = true }
ironrdp-cliprdr = { version = "=0.7.0", optional = true }
ironrdp-input = { version = "=0.7.0", optional = true }
ironrdp-rdpsnd = { version = "0.9", optional = true }
ironrdp-rdpdr = { path = "../../third_party/ironrdp-rdpdr", optional = true }
ironrdp-server = { version = "=0.13.0", optional = true }
openh264 = { version = "=0.9.8", optional = true, default-features = false, features = ["libloading"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std", "ring"] }
x509-cert = { version = "0.2", optional = true, default-features = false, features = ["std"] }
oxydesk-rdp = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

[features]
ironrdp = ["dep:anyhow", "dep:ironrdp-connector", "dep:ironrdp-session", "dep:ironrdp-pdu", "dep:ironrdp-graphics", "dep:ironrdp-svc", "dep:ironrdp-core", "dep:ironrdp-blocking", "dep:ironrdp-egfx", "dep:ironrdp-dvc", "dep:ironrdp-displaycontrol", "dep:ironrdp-cliprdr", "dep:ironrdp-input", "dep:ironrdp-rdpsnd", "dep:ironrdp-rdpdr", "dep:ironrdp-server", "dep:openh264", "dep:rustls", "dep:x509-cert", "dep:oxydesk-rdp", "dep:tracing"]
