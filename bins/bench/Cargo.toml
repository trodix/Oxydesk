[package]
name = "bench"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
vaapi = ["oxydesk-encode/vaapi"]
# `--kwin`: benchmark on a real KWin virtual session (PipeWire capture, SHM or DMA-BUF).
kwin = ["oxydesk-capture/kwin", "dep:oxydesk-session"]

[dependencies]
oxydesk-core.workspace = true
oxydesk-capture.workspace = true
oxydesk-encode = { workspace = true, features = ["openh264"] }
oxydesk-session = { workspace = true, optional = true }
