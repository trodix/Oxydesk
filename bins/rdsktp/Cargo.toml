[package]
name = "rdsktp"
description = "Serveur RDP headless pour KDE Plasma (RustyDesktop)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Session KWin réelle : capture PipeWire + entrées fake_input (nécessite libpipewire-dev et libclang).
kwin = ["rdsktp-capture/kwin", "rdsktp-input/kwin", "rdsktp-clipboard/wayland", "dep:rdsktp-session", "dep:rdsktp-input", "dep:rdsktp-clipboard"]

[dependencies]
rdsktp-input = { workspace = true, optional = true }
rdsktp-clipboard = { workspace = true, optional = true }
rdsktp-audio.workspace = true
rdsktp-session = { workspace = true, optional = true }
rdsktp-core.workspace = true
rdsktp-capture.workspace = true
rdsktp-encode = { workspace = true, features = ["openh264"] }
rdsktp-rdp.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"

[package.metadata.deb]
features = ["kwin"]
name = "rdsktp"
maintainer = "Sébastien Vallet <sebastien.vallet89@gmail.com>"
copyright = "RustyDesktop contributors"
extended-description = "Serveur RDP headless pour KDE Plasma (Wayland)."
section = "net"
priority = "optional"
depends = "$auto, libopenh264-8"
assets = [
    ["target/release/rdsktp", "usr/bin/", "755"],
    ["target/release/rdsktp-testapp", "usr/lib/rdsktp/", "755"],
    ["../../dist/rdsktp.desktop", "usr/share/applications/", "644"],
    ["../../dist/rdsktp.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../dist/debian/"
