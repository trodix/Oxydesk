[package]
name = "rdsktp"
description = "Headless RDP server for KDE Plasma (RustyDesktop)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# GPU H.264 encoder through VA-API (links libva; needs libva-dev). Falls back to openh264 at run time.
vaapi = ["rdsktp-encode/vaapi"]
# Real KWin session: PipeWire capture + fake_input input (requires libpipewire-dev and libclang).
kwin = ["dep:rdsktp-scaling", "rdsktp-capture/kwin", "rdsktp-input/kwin", "rdsktp-clipboard/wayland", "dep:rdsktp-session", "dep:rdsktp-input", "dep:rdsktp-clipboard"]

[dependencies]
rdsktp-input = { workspace = true, optional = true }
rdsktp-clipboard = { workspace = true, optional = true }
rdsktp-audio.workspace = true
rdsktp-drivefs.workspace = true
rdsktp-spool.workspace = true
rdsktp-remote.workspace = true
rdsktp-session = { workspace = true, optional = true }
rdsktp-core.workspace = true
rdsktp-capture.workspace = true
rdsktp-encode = { workspace = true, features = ["openh264"] }
rdsktp-scaling = { workspace = true, optional = true }
rdsktp-rdp.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14"

[package.metadata.deb]
features = ["kwin"]
name = "rdsktp"
maintainer = "Sébastien Vallet <sebastien.vallet89@gmail.com>"
copyright = "2026 Sébastien Vallet, AGPL-3.0-only"
extended-description = "Headless RDP server for KDE Plasma (Wayland)."
section = "net"
priority = "optional"
depends = "$auto, libopenh264-8, libkscreen-bin, fuse3"
recommends = "cups, cups-filters, ghostscript"
assets = [
    ["target/release/rdsktp", "usr/bin/", "755"],
    ["../../LICENSE", "usr/share/doc/rdsktp/LICENSE", "644"],
    ["target/release/rdsktp-testapp", "usr/lib/rdsktp/", "755"],
    ["../../dist/rdsktp.desktop", "usr/share/applications/", "644"],
    ["../../dist/rdsktp-agent.desktop", "usr/share/applications/", "644"],
    ["../../dist/rdsktp.service", "lib/systemd/system/", "644"],
    ["target/release/rdsktp-authd", "usr/bin/", "755"],
    ["target/release/rdsktp-agent", "usr/bin/", "755"],
    ["../../dist/rdsktp-authd.service", "lib/systemd/system/", "644"],
    ["../../dist/rdsktp-agent@.service", "lib/systemd/system/", "644"],
    ["../../dist/pam/rdsktp", "etc/pam.d/", "644"],
    ["../../dist/pam/rdsktp-session", "etc/pam.d/", "644"],
    ["../../dist/sysusers/rdsktp.conf", "usr/lib/sysusers.d/", "644"],
    ["target/release/rdsktp-cups-backend", "usr/lib/cups/backend/rdsktp", "700"],
]
maintainer-scripts = "../../dist/debian/"

# RPM (Fedora, RHEL, Rocky) built with cargo-generate-rpm from the same binaries as the .deb. The files that differ from the
# Debian package: PAM stacks (system-auth instead of common-*), unit directory (/usr/lib/systemd/system), package names.
[package.metadata.generate-rpm]
name = "rdsktp"
summary = "Headless RDP server for KDE Plasma (Wayland)"
license = "AGPL-3.0-only"
auto-req = "auto"
post_install_script = "dist/rpm/post.sh"
assets = [
    { source = "target/release/rdsktp", dest = "/usr/bin/rdsktp", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/rdsktp/LICENSE", mode = "644", doc = true },
    { source = "target/release/rdsktp-testapp", dest = "/usr/lib/rdsktp/rdsktp-testapp", mode = "755" },
    { source = "target/release/rdsktp-authd", dest = "/usr/bin/rdsktp-authd", mode = "755" },
    { source = "target/release/rdsktp-agent", dest = "/usr/bin/rdsktp-agent", mode = "755" },
    { source = "target/release/rdsktp-cups-backend", dest = "/usr/lib/cups/backend/rdsktp", mode = "700" },
    { source = "dist/rdsktp.desktop", dest = "/usr/share/applications/rdsktp.desktop", mode = "644" },
    { source = "dist/rdsktp-agent.desktop", dest = "/usr/share/applications/rdsktp-agent.desktop", mode = "644" },
    { source = "dist/rdsktp.service", dest = "/usr/lib/systemd/system/rdsktp.service", mode = "644" },
    { source = "dist/rdsktp-authd.service", dest = "/usr/lib/systemd/system/rdsktp-authd.service", mode = "644" },
    { source = "dist/rdsktp-agent@.service", dest = "/usr/lib/systemd/system/rdsktp-agent@.service", mode = "644" },
    { source = "dist/pam/rpm/rdsktp", dest = "/etc/pam.d/rdsktp", mode = "644", config = true },
    { source = "dist/pam/rpm/rdsktp-session", dest = "/etc/pam.d/rdsktp-session", mode = "644", config = true },
    { source = "dist/sysusers/rdsktp.conf", dest = "/usr/lib/sysusers.d/rdsktp.conf", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fuse3 = "*"
pam = "*"
systemd = "*"

[package.metadata.generate-rpm.recommends]
openh264 = "*"
libkscreen = "*"
cups = "*"
ghostscript = "*"
