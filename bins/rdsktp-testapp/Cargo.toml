[package]
name = "rdsktp-testapp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic fullscreen window (marker + heartbeat) to test capture and input under a real KWin."

[dependencies]
rdsktp-capture.workspace = true
rdsktp-core.workspace = true
rdsktp-clipboard = { workspace = true, features = ["wayland"] }
rdsktp-audio.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
