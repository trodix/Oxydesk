[package]
name = "rdsktp-testapp"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Fenêtre plein écran déterministe (marqueur + heartbeat) pour tester la capture et les entrées sous un vrai KWin."

[dependencies]
rdsktp-capture.workspace = true
rdsktp-core.workspace = true
rdsktp-clipboard = { workspace = true, features = ["wayland"] }
rdsktp-audio.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
