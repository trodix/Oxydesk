[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/capture",
    "crates/encode",
    "crates/rdp",
    "bins/bench",
    "bins/rdsktp",
    "bins/rdp-test-client",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rdsktp-core = { path = "crates/core" }
rdsktp-capture = { path = "crates/capture" }
rdsktp-encode = { path = "crates/encode" }
rdsktp-rdp = { path = "crates/rdp" }
