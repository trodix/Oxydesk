[workspace]
resolver = "2"
# Vendored third-party crates are not linted or formatted with the project.
exclude = ["third_party"]
members = [
    "crates/core",
    "crates/capture",
    "crates/encode",
    "crates/scaling",
    "crates/input",
    "crates/clipboard",
    "crates/drivefs",
    "crates/spool",
    "crates/audio",
    "crates/agent-proto",
    "crates/authd-proto",
    "crates/remote",
    "bins/authd",
    "bins/rdsktp-agent",
    "bins/rdsktp-cups-backend",
    "crates/rdp",
    "crates/session",
    "bins/bench",
    "bins/rdsktp",
    "bins/rdsktp-testapp",
    "bins/rdp-test-client",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rdsktp-core = { path = "crates/core" }
rdsktp-capture = { path = "crates/capture" }
rdsktp-clipboard = { path = "crates/clipboard" }
rdsktp-drivefs = { path = "crates/drivefs" }
rdsktp-spool = { path = "crates/spool" }
rdsktp-audio = { path = "crates/audio" }
rdsktp-agent-proto = { path = "crates/agent-proto" }
rdsktp-authd-proto = { path = "crates/authd-proto" }
rdsktp-remote = { path = "crates/remote" }
rdsktp-input = { path = "crates/input" }
rdsktp-encode = { path = "crates/encode" }
rdsktp-scaling = { path = "crates/scaling" }
rdsktp-session = { path = "crates/session" }
rdsktp-rdp = { path = "crates/rdp" }

# IronRDP patched locally (third_party/): the Monitor Layout PDU announces the real monitors (multi-monitor
# mstsc) and the client's GCC monitors are exposed. See docs/decisions/011-dynamic-monitors.md.
[patch.crates-io]
ironrdp-acceptor = { path = "third_party/ironrdp-acceptor" }
ironrdp-server = { path = "third_party/ironrdp-server" }
