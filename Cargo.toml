[workspace]
resolver = "2"
# Vendored third-party crates are not linted or formatted with the project.
exclude = ["third_party"]
members = [
    "crates/core",
    "crates/capture",
    "crates/encode",
    "crates/scaling",
    "crates/input",
    "crates/clipboard",
    "crates/drivefs",
    "crates/spool",
    "crates/audio",
    "crates/agent-proto",
    "crates/authd-proto",
    "crates/remote",
    "bins/authd",
    "bins/oxydesk-agent",
    "bins/oxydesk-cups-backend",
    "crates/rdp",
    "crates/session",
    "bins/bench",
    "bins/oxydesk",
    "bins/oxydesk-testapp",
    "bins/rdp-test-client",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
oxydesk-core = { path = "crates/core" }
oxydesk-capture = { path = "crates/capture" }
oxydesk-clipboard = { path = "crates/clipboard" }
oxydesk-drivefs = { path = "crates/drivefs" }
oxydesk-spool = { path = "crates/spool" }
oxydesk-audio = { path = "crates/audio" }
oxydesk-agent-proto = { path = "crates/agent-proto" }
oxydesk-authd-proto = { path = "crates/authd-proto" }
oxydesk-remote = { path = "crates/remote" }
oxydesk-input = { path = "crates/input" }
oxydesk-encode = { path = "crates/encode" }
oxydesk-scaling = { path = "crates/scaling" }
oxydesk-session = { path = "crates/session" }
oxydesk-rdp = { path = "crates/rdp" }

# IronRDP patched locally (third_party/): the Monitor Layout PDU announces the real monitors (multi-monitor
# mstsc) and the client's GCC monitors are exposed. See docs/decisions/011-dynamic-monitors.md.
[patch.crates-io]
ironrdp-acceptor = { path = "third_party/ironrdp-acceptor" }
ironrdp-server = { path = "third_party/ironrdp-server" }
