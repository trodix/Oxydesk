[workspace]
resolver = "2"
# Vendored third-party crates are not linted or formatted with the project.
exclude = ["third_party"]
members = [
    "crates/core",
    "crates/capture",
    "crates/encode",
    "crates/scaling",
    "crates/input",
    "crates/clipboard",
    "crates/audio",
    "crates/agent-proto",
    "crates/authd-proto",
    "crates/remote",
    "bins/authd",
    "bins/rdsktp-agent",
    "crates/rdp",
    "crates/session",
    "bins/bench",
    "bins/rdsktp",
    "bins/rdsktp-testapp",
    "bins/rdp-test-client",
    "xtask",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rdsktp-core = { path = "crates/core" }
rdsktp-capture = { path = "crates/capture" }
rdsktp-clipboard = { path = "crates/clipboard" }
rdsktp-audio = { path = "crates/audio" }
rdsktp-agent-proto = { path = "crates/agent-proto" }
rdsktp-authd-proto = { path = "crates/authd-proto" }
rdsktp-remote = { path = "crates/remote" }
rdsktp-input = { path = "crates/input" }
rdsktp-encode = { path = "crates/encode" }
rdsktp-scaling = { path = "crates/scaling" }
rdsktp-session = { path = "crates/session" }
rdsktp-rdp = { path = "crates/rdp" }
