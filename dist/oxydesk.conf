# /etc/oxydesk/oxydesk.conf - configuration of the Oxydesk RDP server
#
# Format: "key = value", one per line. The keys are the long options of `oxydesk` without the leading "--"
# (see `oxydesk --help`). Lines starting with "#" or ";" are comments; there are no trailing comments (a value
# may contain "#"). A value may be wrapped in double quotes. An unknown key stops the server at start-up, so
# a typo is never silently ignored.
#
# Precedence, highest first:
#   1. options on the command line (they replace the file's value of the same key)
#   2. drop-in files /etc/oxydesk/oxydesk.conf.d/*.conf, in alphabetical order (key by key over this file)
#   3. this file
#   4. built-in defaults (shown below as the commented value)
# Put local changes in a drop-in (e.g. oxydesk.conf.d/10-local.conf): this file belongs to the package and an
# upgrade never overwrites your edits, but it will not receive new documentation either.
#
# Use another file with `oxydesk --config /path/file.conf` (its drop-ins are then /path/file.conf.d/*.conf).
# Changes apply when the service restarts: systemctl restart oxydesk
#
# Secrets do not belong here: the NLA password is read from the OXYDESK_PASSWORD environment variable only.

# ---------------------------------------------------------------------------------------------------------------
# Mode: exactly one of login / session / test-mode. A mode given on the command line replaces the one below.
# ---------------------------------------------------------------------------------------------------------------

# Remote login (default): the client types a Linux account and password, checked by PAM through oxydesk-authd, and gets
# its own KDE Plasma session (needs oxydesk-authd.service). No NLA in this mode.
login = yes

# Virtual KWin session of the user running the server, captured and controlled (needs the `kwin` build).
# session = kwin

# Synthetic desktop (test pattern, echo of the keyboard and clipboard). For tests only: not a usable desktop.
# test-mode = yes

# ---------------------------------------------------------------------------------------------------------------
# Network and display
# ---------------------------------------------------------------------------------------------------------------

# Address and port to listen on. Use 127.0.0.1:3389 to accept local connections only, or a port above 1024
# to move away from the RDP default.
# listen = 0.0.0.0:3389

# Directory of the self-signed TLS certificate (tls-cert.pem, tls-key.pem), generated at the first start.
# To use your own certificate, replace both files there.
# state-dir = /var/lib/oxydesk

# Size of the desktop (test-mode and session) in pixels. The client's window size is followed when it can be.
# width = 1920
# height = 1080

# Number of monitors offered, 1 to 16, laid out side by side. In login mode this is only a default:
# the session follows the monitors the client announces (mstsc /multimon, up to 16).
# outputs = 1

# Frames per second captured and sent at most.
# fps = 30

# ---------------------------------------------------------------------------------------------------------------
# Video
# ---------------------------------------------------------------------------------------------------------------

# H.264 encoder: auto (GPU through VA-API when usable, else software), vaapi (GPU only), openh264 (software).
# encoder = auto

# DMA-BUF capture buffers (zero-copy with a GPU encoder): auto (only with a GPU encoder), on, off.
# dmabuf = auto

# Bitrate and number of frames in flight follow what the client's link carries: on or off. Turn off to keep
# a fixed bitrate on a link you know is good.
# adaptive-bitrate = on

# ---------------------------------------------------------------------------------------------------------------
# Audio
# ---------------------------------------------------------------------------------------------------------------

# pulse (capture of the session's sound through PipeWire/PulseAudio), tone (test tone), off.
# Default: pulse with a KWin session, tone in test-mode.
# audio = pulse

# ---------------------------------------------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------------------------------------------

# Enables NLA (network level authentication) for this account name; the password comes from the
# OXYDESK_PASSWORD environment variable (for instance Environment= in a drop-in of the unit, mode 0600).
# Incompatible with login mode.
# nla-user = alice

# Login mode: failed attempts before a client address (default 5) or an account (default 10) is blocked,
# and for how many seconds (default 300).
# max-login-failures = 5
# max-user-failures = 10
# login-lockout-secs = 300

# Login mode: after a network loss, the client (mstsc, FreeRDP) resumes its session by itself, without the password,
# if it comes back within this many seconds (default 10; 0 turns automatic reconnection off). The cookie it
# presents is single use and valid only from the same address; a client that disconnects on purpose gets none.
# reconnect-timeout = 10

# Login mode: what a successful login does about the user's desktop.
#   new     a session of our own, a private virtual KWin
#   attach  the Plasma session the user already has (the one on the physical screen); refused when there is none.
#           The real monitors are never changed: the image is scaled to the client's window. A client with more
#           monitors than the desktop gets extra virtual ones (KWin 6.7); with fewer, the windows of the other
#           monitors are brought onto the ones it shows, and put back when it leaves. The sound is captured without being diverted, so the
#           local speakers keep playing. A desktop without any monitor (the screens are unplugged) is shown on
#           virtual outputs, one per client monitor, which also gives access to its lock screen (KWin 6.7).
#   auto    the existing Plasma session if there is one, else a new one (default)
# A user whose Oxydesk session is already running keeps it whatever the policy. Needs the KWin of that session to
# accept oxydesk-agent (see the documentation: log out and in once after installing the package).
# session-policy = auto

# Login mode, joined session: what happens to the monitors the client added (more monitors than the desktop has)
# when it leaves.
#   keep    they stay in the Plasma session as virtual displays (System Settings > Display), with their windows;
#           their windows are parked on a virtual desktop of their own ("Oxydesk Virtual-N"), which stays too and
#           gives them back to the monitor when the next client brings it. They go when the agent stops (default)
#   remove  they are removed with that desktop, the windows on them go to a real monitor and the windows brought
#           over from hidden monitors go back where they were
# Applies when the session is joined, not afterwards.
# virtual-outputs = keep

# A client that stops answering (network cut without a clean close) is dropped after this many seconds, which
# frees the server for its reconnection (default 8; 0 leaves it to the kernel, which takes minutes).
# dead-peer-timeout = 8

# Login mode: socket of oxydesk-authd, the only privileged component.
# authd-socket = /run/oxydesk/authd.sock

# ---------------------------------------------------------------------------------------------------------------
# KWin session (session = kwin)
# ---------------------------------------------------------------------------------------------------------------

# Name of the Wayland socket of the virtual KWin.
# kwin-socket = oxydesk-0

# Program started in the session, with its arguments. Repeat the line for several programs. A list given on
# the command line (--session-app) replaces this whole list.
# session-app = plasmashell
# session-app = konsole

# ---------------------------------------------------------------------------------------------------------------
# Redirections of the client's resources
# ---------------------------------------------------------------------------------------------------------------

# Drives: the client's drives are mounted (FUSE) under DIR/<name>. Path, or off.
# Default with a KWin session: $XDG_RUNTIME_DIR/oxydesk-drives.
# drives-dir = off

# Printers: one socket per printer of the client in this directory. Path, or off.
# Default with a KWin session: $XDG_RUNTIME_DIR/oxydesk-printers.
# printers = off

# Also create a CUPS queue per printer of the client: on or off (default: on when CUPS answers).
# printers-cups = on

# Format of the jobs sent to the client's printers: auto, raw, raw:ps|pcl|text, xps. Per printer with
# PATTERN=MODE ("*" matches anything), comma-separated, e.g. "xps,HP*=raw:pcl".
# auto = raw when the driver's name states a language, XPS otherwise (if the client takes it), else the
# printer is refused.
# printer-mode = auto

# Login mode: look of the login screen, in a file of `key = value` lines (same syntax as this file; paths are relative
# to the theme file). Every key is optional (colours, logo, background
# picture, texts, fonts); the list is in docs/greeter-theme.md of the source tree. The server refuses to start on a
# mistake in the file, and only logs a missing picture or font.
# greeter-theme = /etc/oxydesk/greeter.theme
